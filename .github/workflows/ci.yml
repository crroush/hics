name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  geospatial-smoke:
    name: Geospatial smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda geospatial environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: hics-ci
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: false

      - name: Install native geospatial dependencies
        run: conda install -y gdal libspatialindex

      - name: Install Python package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.7.22
          uv pip install --system ".[geo]"

      - name: Build package
        run: uv build

      - name: Smoke test package and GDAL imports
        run: python -c "import hics; from osgeo import gdal; print(gdal.VersionInfo('--version'))"
