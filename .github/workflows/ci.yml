name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ubuntu-2404-build:
    name: Build and test on Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.22"

      - name: Install Ubuntu GDAL development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
          test "$(gdal-config --version)" = "3.8.4"

      - name: Install project with geo dependencies
        run: uv sync --extra geo --dev

      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest -q tests
