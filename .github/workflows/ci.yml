name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ubuntu-2404-build:
    name: Build with Ubuntu 24.04 system GDAL
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.22"

      - name: Install Ubuntu GDAL packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libspatialindex-dev
          echo "GDAL_VERSION=$(gdal-config --version)" >> "$GITHUB_ENV"
          gdal-config --version

      - name: Install Python dependencies
        run: uv sync --extra geo --dev

      - name: Install matching GDAL Python bindings
        run: |
          uv pip install "gdal==${GDAL_VERSION}"
          uv run python -c "from osgeo import gdal; print(gdal.VersionInfo('--version'))"

      - name: Build package
        run: uv build

      - name: Smoke test package import
        run: uv run python -c "import hics; from osgeo import gdal; print(gdal.VersionInfo('--version'))"
